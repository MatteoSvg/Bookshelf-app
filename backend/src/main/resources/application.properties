# ===============================================
# CONFIGURAZIONE APPLICAZIONE
# ===============================================
spring.application.name=biblioteca-backend
server.port=8080

# ===============================================
# DATABASE H2 IN MEMORY
# ===============================================
spring.datasource.url=jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web di H2 -> http://localhost:8080/h2-console
# JDBC URL da usare nella console: jdbc:h2:mem:bibliotecadb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================================
# SPRING DATA JPA / HIBERNATE
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: lo schema viene creato all'avvio e distrutto allo shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra le query SQL generate da Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# INIZIALIZZAZIONE DATI (data.sql)
# ===============================================
# Esegue data.sql DOPO la creazione dello schema da parte di Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
