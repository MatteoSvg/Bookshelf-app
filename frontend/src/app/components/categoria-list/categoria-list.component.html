<h2 class="mb-3">🏷️ Categorie</h2>

@if (errore) {
<div class="alert alert-danger">{{ errore }}</div>
}

<!-- Form di inserimento/modifica -->
<div class="card shadow-sm mb-4">
    <div class="card-header bg-light fw-semibold">
        {{ inModifica ? 'Modifica categoria' : 'Nuova categoria' }}
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-12 col-md-5">
                <label class="form-label">Nome</label>
                <input class="form-control" [(ngModel)]="form.nome" placeholder="Es. Romanzo" />
            </div>
            <div class="col-12 col-md-7">
                <label class="form-label">Descrizione</label>
                <input class="form-control" [(ngModel)]="form.descrizione" placeholder="Breve descrizione" />
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        @if (inModifica) {
        <button class="btn btn-secondary me-2" (click)="annulla()">Annulla</button>
        }
        <button class="btn btn-primary" (click)="salva()">
            {{ inModifica ? 'Salva modifiche' : 'Aggiungi' }}
        </button>
    </div>
</div>

<!-- Tabella elenco -->
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark">
                <tr>
                    <th style="width:80px">ID</th>
                    <th>Nome</th>
                    <th>Descrizione</th>
                    <th class="text-end" style="width:170px">Azioni</th>
                </tr>
            </thead>
            <tbody>
                @for (c of categorie; track c.id) {
                <tr>
                    <td>{{ c.id }}</td>
                    <td class="fw-semibold">{{ c.nome }}</td>
                    <td class="text-muted">{{ c.descrizione || '-' }}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" (click)="modifica(c)">
                            Modifica
                        </button>
                        <button class="btn btn-sm btn-outline-danger" (click)="elimina(c.id!)">
                            Elimina
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">
                        Nessuna categoria presente.
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
