<h2 class="mb-3">✍️ Autori</h2>

@if (errore) {
<div class="alert alert-danger">{{ errore }}</div>
}

<div class="card shadow-sm mb-4">
    <div class="card-header bg-light fw-semibold">
        {{ inModifica ? 'Modifica autore' : 'Nuovo autore' }}
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <label class="form-label">Nome</label>
                <input class="form-control" [(ngModel)]="form.nome" placeholder="Es. Italo" />
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label">Cognome</label>
                <input class="form-control" [(ngModel)]="form.cognome" placeholder="Es. Calvino" />
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label">Nazionalita</label>
                <input class="form-control" [(ngModel)]="form.nazionalita" placeholder="Es. Italiana" />
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        @if (inModifica) {
        <button class="btn btn-secondary me-2" (click)="annulla()">Annulla</button>
        }
        <button class="btn btn-primary" (click)="salva()">
            {{ inModifica ? 'Salva modifiche' : 'Aggiungi' }}
        </button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark">
                <tr>
                    <th style="width:80px">ID</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Nazionalita</th>
                    <th class="text-end" style="width:170px">Azioni</th>
                </tr>
            </thead>
            <tbody>
                @for (a of autori; track a.id) {
                <tr>
                    <td>{{ a.id }}</td>
                    <td class="fw-semibold">{{ a.nome }}</td>
                    <td class="fw-semibold">{{ a.cognome }}</td>
                    <td class="text-muted">{{ a.nazionalita || '-' }}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" (click)="modifica(a)">
                            Modifica
                        </button>
                        <button class="btn btn-sm btn-outline-danger" (click)="elimina(a.id!)">
                            Elimina
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                        Nessun autore presente.
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
